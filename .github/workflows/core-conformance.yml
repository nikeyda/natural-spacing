name: Core conformance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, Web, and ASR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:consumer:npm
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - run: npm run test:browser

  swift:
    name: Swift core, UIKit, AppKit, and SwiftUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - run: swift test
      - run: bash scripts/test-swift-consumer.sh
      - run: swift build --package-path examples/acceptance/macos --scratch-path /tmp/natural-spacing-macos-acceptance-build
      - run: bash scripts/test-ios-acceptance-host.sh
      - run: bash scripts/test-ios-simulator.sh
      - run: swift build --scratch-path /tmp/natural-spacing-swift-ios-build --triple arm64-apple-ios13.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

  kotlin:
    name: Kotlin/JVM, Android Views, and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: sdkmanager "platforms;android-35"
      - run: ./gradlew --no-daemon conformance :android-views:testDebugUnitTest :android-views:assembleDebug :compose:testDebugUnitTest
        working-directory: packages/kotlin
      - run: bash scripts/test-kotlin-consumer.sh
      - run: bash scripts/test-android-acceptance-host.sh

  dotnet:
    name: C#/.NET core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - run: dotnet run --project packages/dotnet/NaturalSpacing.Conformance/NaturalSpacing.Conformance.csproj -- .
      - run: dotnet build packages/dotnet/NaturalSpacing.Core/NaturalSpacing.Core.csproj -c Release --no-restore
      - run: bash scripts/test-dotnet-consumer.sh

  windows-build:
    name: WinUI 3 and WPF compile
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - run: dotnet build packages/dotnet/NaturalSpacing.WinUI/NaturalSpacing.WinUI.csproj -c Release
      - run: dotnet build packages/dotnet/NaturalSpacing.Wpf/NaturalSpacing.Wpf.csproj -c Release
      - run: bash scripts/test-windows-winui-acceptance-host.sh
      - run: bash scripts/test-windows-wpf-acceptance-host.sh

  dart:
    name: Dart core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.3
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib tool
      - run: dart analyze
      - run: dart run tool/conformance.dart ../..
      - run: bash ../../scripts/test-dart-consumer.sh

  flutter:
    name: Flutter formatter and consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/install-flutter-ci.sh
      - run: FLUTTER_SKIP_UPDATE_CHECK=true FLUTTER_SUPPRESS_ANALYTICS=true flutter --version
      - run: bash scripts/test-flutter.sh
      - run: bash scripts/test-flutter-target-builds.sh
